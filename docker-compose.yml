name: jengaflow
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3001
      APP_NAME: ${APP_NAME:-JengaFlow}
      APP_URL: ${APP_URL:-https://jengaflow.qwerty.co.ke}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.jengaflow.qwerty.co.ke}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://jengaflow.qwerty.co.ke}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_HOST: ${DATABASE_HOST:-}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DATABASE_NAME: ${DATABASE_NAME:-}
      MIGRATIONS_DATABASE_URL: ${MIGRATIONS_DATABASE_URL:-}
      MIGRATIONS_DATABASE_HOST: ${MIGRATIONS_DATABASE_HOST:-}
      MIGRATIONS_DATABASE_PORT: ${MIGRATIONS_DATABASE_PORT:-}
      MIGRATIONS_DATABASE_USERNAME: ${MIGRATIONS_DATABASE_USERNAME:-}
      MIGRATIONS_DATABASE_PASSWORD: ${MIGRATIONS_DATABASE_PASSWORD:-}
      MIGRATIONS_DATABASE_NAME: ${MIGRATIONS_DATABASE_NAME:-}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-true}
      DATABASE_POOL_MIN: ${DATABASE_POOL_MIN:-2}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
      DATABASE_CONNECT_TIMEOUT_MS: ${DATABASE_CONNECT_TIMEOUT_MS:-10000}
      REDIS_URL: ${REDIS_URL:-}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_TLS: ${REDIS_TLS:-false}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-jengaflow:}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-10000}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.qwerty.co.ke}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      DEFAULT_COUNTRY: ${DEFAULT_COUNTRY:-KE}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-KES}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Africa/Nairobi}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-seaweedfs}
      SEAWEEDFS_ENDPOINT: ${SEAWEEDFS_ENDPOINT:-s3.qwerty.co.ke}
      SEAWEEDFS_PORT: ${SEAWEEDFS_PORT:-443}
      SEAWEEDFS_USE_SSL: ${SEAWEEDFS_USE_SSL:-true}
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-jenga-flow}
      SEAWEEDFS_PUBLIC_URL: ${SEAWEEDFS_PUBLIC_URL:-https://s3.qwerty.co.ke/jenga-flow}
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.qwerty.co.ke}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-jenga-flow}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-${SEAWEEDFS_ACCESS_KEY:-}}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-${SEAWEEDFS_SECRET_KEY:-}}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:-JengaFlow <no-reply@qwerty.co.ke>}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      SENTRY_DSN: ${SENTRY_DSN}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [jengaflow]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
        VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
        VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-}
        VITE_AUTH0_REDIRECT_URI: ${VITE_AUTH0_REDIRECT_URI:-}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    environment:
      VITE_AUTH0_DOMAIN: ${VITE_AUTH0_DOMAIN:-}
      VITE_AUTH0_CLIENT_ID: ${VITE_AUTH0_CLIENT_ID:-}
      VITE_AUTH0_AUDIENCE: ${VITE_AUTH0_AUDIENCE:-}
      VITE_AUTH0_REDIRECT_URI: ${VITE_AUTH0_REDIRECT_URI:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
    depends_on:
      api:
        condition: service_healthy
    networks: [jengaflow]

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    environment:
      TZ: Africa/Nairobi
      BACKUP_ENABLED: ${BACKUP_ENABLED:-false}
      BACKUP_CRON: ${BACKUP_CRON:-0 2 * * *}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      DATABASE_HOST: ${DATABASE_HOST:-}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DATABASE_NAME: ${DATABASE_NAME:-}
      BACKUP_DATABASE_USERNAME: ${BACKUP_DATABASE_USERNAME:-jengaflow_backup}
      BACKUP_DATABASE_PASSWORD: ${BACKUP_DATABASE_PASSWORD:-}
      SEAWEEDFS_ENDPOINT: ${SEAWEEDFS_ENDPOINT:-s3.qwerty.co.ke}
      SEAWEEDFS_PORT: ${SEAWEEDFS_PORT:-443}
      SEAWEEDFS_USE_SSL: ${SEAWEEDFS_USE_SSL:-true}
      SEAWEEDFS_BUCKET: ${SEAWEEDFS_BUCKET:-jenga-flow}
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
    healthcheck:
      test: ["CMD-SHELL", "test -f /etc/crontabs/root"]
      interval: 60s
      timeout: 5s
      retries: 3
    networks: [jengaflow]

networks:
  jengaflow:
    driver: bridge
