name: CI

on:
  push:
    branches: [main]
  # Run on every pull request regardless of target branch (previously only main and one stale branch name).
  pull_request:

concurrency:
  group: jengaflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jengaflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jengaflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 5432
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: jengaflow
      DATABASE_SSL: "false"
      JWT_ACCESS_SECRET: ci-only-access-secret-do-not-use-in-production-000000000000
      JWT_REFRESH_SECRET: ci-only-refresh-secret-do-not-use-in-production-000000000000
      GOOGLE_CLIENT_ID: ci-test-client.apps.googleusercontent.com
      REDIS_URL: ""
      SEAWEEDFS_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Compile API for migrations
        run: pnpm --filter @jengaflow/api build
      - name: Apply database migrations
        working-directory: apps/api
        run: pnpm exec typeorm -d dist/database/data-source.js migration:run
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
      - name: Payroll integration test (non-superuser role, RLS enforced)
        working-directory: apps/api
        env:
          TZ: Africa/Nairobi
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/jengaflow
          TEST_APP_DATABASE_URL: postgres://jf_app:ci-app-password@127.0.0.1:5432/jengaflow
        run: |
          export PGPASSWORD=postgres
          psql -h 127.0.0.1 -U postgres jengaflow -v ON_ERROR_STOP=1 -c "CREATE ROLE jf_app LOGIN PASSWORD 'ci-app-password' NOSUPERUSER NOBYPASSRLS"
          psql -h 127.0.0.1 -U postgres jengaflow -v ON_ERROR_STOP=1 -c "GRANT USAGE ON SCHEMA public TO jf_app; GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO jf_app; GRANT USAGE, SELECT, UPDATE ON ALL SEQUENCES IN SCHEMA public TO jf_app;"
          pnpm exec jest --runInBand src/modules/payroll/payroll.integration.spec.ts
