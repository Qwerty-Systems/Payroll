name: Build and Push JengaFlow Images

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jengaflow-registry-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: registry.qwerty.co.ke
  IMAGE_NAMESPACE: jengaflow
  PLATFORM: linux/amd64

jobs:
  publish:
    name: Build and push production images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Qwerty registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USER }}
          password: ${{ secrets.DOCKER_REGISTRY_PASS }}

      - name: Generate API image tags
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push API
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha,scope=jengaflow-api
          cache-to: type=gha,mode=max,scope=jengaflow-api

      - name: Generate web image tags
        id: web-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/web
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push web
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.web-meta.outputs.tags }}
          labels: ${{ steps.web-meta.outputs.labels }}
          build-args: |
            VITE_AUTH0_DOMAIN=${{ vars.VITE_AUTH0_DOMAIN }}
            VITE_AUTH0_CLIENT_ID=${{ vars.VITE_AUTH0_CLIENT_ID }}
            VITE_AUTH0_AUDIENCE=${{ vars.VITE_AUTH0_AUDIENCE }}
            VITE_AUTH0_REDIRECT_URI=${{ vars.VITE_AUTH0_REDIRECT_URI }}
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          cache-from: type=gha,scope=jengaflow-web
          cache-to: type=gha,mode=max,scope=jengaflow-web

      - name: Generate backup image tags
        id: backup-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/backup
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push backup
        id: backup
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backup/Dockerfile
          platforms: ${{ env.PLATFORM }}
          push: true
          tags: ${{ steps.backup-meta.outputs.tags }}
          labels: ${{ steps.backup-meta.outputs.labels }}
          cache-from: type=gha,scope=jengaflow-backup
          cache-to: type=gha,mode=max,scope=jengaflow-backup

      - name: Verify published manifests
        shell: bash
        run: |
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA}"
          for image in api web backup; do
            ref="${REGISTRY}/${IMAGE_NAMESPACE}/${image}:${SHA_TAG}"
            echo "Checking ${ref}"
            docker buildx imagetools inspect "${ref}"
          done

      - name: Print Coolify image tag
        run: |
          echo "All three image builds and pushes completed."
          echo "Set IMAGE_TAG=${GITHUB_SHA} in Coolify."
          echo "Images:"
          echo "  ${REGISTRY}/${IMAGE_NAMESPACE}/api:${GITHUB_SHA}"
          echo "  ${REGISTRY}/${IMAGE_NAMESPACE}/web:${GITHUB_SHA}"
          echo "  ${REGISTRY}/${IMAGE_NAMESPACE}/backup:${GITHUB_SHA}"
